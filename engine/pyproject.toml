[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-scientific-reading-engine"
version = "0.1.0"
description = "Codex 驱动的可复现个人文献阅读工作流"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "TyrionH-is-coding" }]
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "latex2mathml>=3.81,<4",
  "Pillow>=12,<13",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
scientific-reading = "scientific_reading.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["scientific_reading*", "reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
